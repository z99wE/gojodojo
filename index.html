<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0520" />
    <title>संख्या टर्बो: 8-बिट ग्रैंड प्रिक्स | Sankhya Turbo: 8-Bit GP</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body class="arcade-body">
    <div id="arcade-container">
      <!-- CRT Screen Bezel & Canvas -->
      <div id="crt-screen">
        <canvas id="game-canvas"></canvas>
        <div class="crt-scanlines"></div>
      </div>

      <!-- Mobile Touch Controls Bar -->
      <div id="touch-controls" class="hidden">
        <div class="touch-steer-group">
          <button id="btn-steer-up" class="touch-btn" type="button">▲ LANE</button>
          <button id="btn-steer-down" class="touch-btn" type="button">▼ LANE</button>
        </div>
        <div class="touch-action-group">
          <button id="btn-shift-down" class="touch-btn" type="button">GEAR -</button>
          <button id="btn-shift-up" class="touch-btn pulse-glow" type="button">SHIFT [SPACE]</button>
          <button id="btn-nitro" class="touch-btn nitro-btn" type="button">NITRO [N]</button>
        </div>
      </div>

      <!-- Start / Garage Menu Overlay -->
      <div id="start" class="overlay">
        <div class="arcade-card">
          <div class="arcade-header-tag">[ ARCADE MOTORSPORT SYSTEM ]</div>
          <h1 class="arcade-title">संख्या टर्बो</h1>
          <div class="arcade-sub">SANKHYA TURBO: 8-BIT GRAND PRIX</div>

          <!-- Grade Selector (Class 1 - 8) -->
          <div class="selector-section">
            <label class="selector-label">कक्षा / CLASS STANDARD:</label>
            <div id="grade-selector" class="chip-group">
              <button class="chip-btn" data-grade="1">G1</button>
              <button class="chip-btn" data-grade="2">G2</button>
              <button class="chip-btn" data-grade="3">G3</button>
              <button class="chip-btn" data-grade="4">G4</button>
              <button class="chip-btn active" data-grade="5">G5</button>
              <button class="chip-btn" data-grade="6">G6</button>
              <button class="chip-btn" data-grade="7">G7</button>
              <button class="chip-btn" data-grade="8">G8</button>
            </div>
          </div>

          <!-- Grand Prix Track Circuit Selector -->
          <div class="selector-section">
            <label class="selector-label">सर्किट / CIRCUIT:</label>
            <div id="circuit-selector" class="chip-group circuit-group">
              <button class="chip-btn circuit-btn active" data-circuit="physics">PHYSICS VELOCITY</button>
              <button class="chip-btn circuit-btn" data-circuit="chemistry">CHEMISTRY REACTOR</button>
              <button class="chip-btn circuit-btn" data-circuit="biology">BIOLOGY BIO-SPRINT</button>
              <button class="chip-btn circuit-btn" data-circuit="maths">MATHS MATRIX 500</button>
            </div>
          </div>

          <!-- Controls Quick Reference -->
          <div class="controls-guide">
            <div class="guide-item">
              <span class="guide-key">SPACEBAR</span>
              <span class="guide-desc">Shift Up (Hit GREEN Zone on Tachometer!)</span>
            </div>
            <div class="guide-item">
              <span class="guide-key">▲ / ▼</span>
              <span class="guide-desc">Switch Lanes (Dodge Slicks, Grab Nitro)</span>
            </div>
            <div class="guide-item">
              <span class="guide-key">1, 2, 3, 4</span>
              <span class="guide-desc">Answer STEM Radio Pitstop for Super Nitro</span>
            </div>
          </div>

          <!-- Controls Buttons -->
          <div class="arcade-action-bar">
            <button id="lang-btn" class="arcade-secondary-btn" type="button">LANG: EN/HI</button>
            <button id="audio-btn" class="arcade-secondary-btn" type="button">AUDIO: ON</button>
            <button id="start-btn" class="arcade-start-btn" type="button">START RACE ➔</button>
          </div>
        </div>
      </div>
    </div>

    <!-- UI Overlay Mounting for Modals / Telemetry -->
    <div id="ui"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
