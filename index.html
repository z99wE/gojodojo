<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d3b33" />
    <title>Sankhya Strike / संख्या स्ट्राइक</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0f1f1b;
        font-family: "Noto Sans Devanagari", "Nirmala UI", "Mangal", system-ui, sans-serif;
      }
      #app,
      #app canvas {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(15, 31, 27, 0.85);
        color: #f4f1e8;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      .overlay.hidden,
      .hidden {
        display: none;
      }
      .overlay button {
        min-height: 56px;
        min-width: 240px;
        padding: 0 24px;
        font-size: 1.25rem;
        border: none;
        border-radius: 12px;
        background: #1d3b33;
        color: #f4f1e8;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="start" class="overlay">
      <h1>संख्या स्ट्राइक</h1>
      <p>Sankhya Strike</p>
      <button id="start-btn" type="button">शुरू करें / Start</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
